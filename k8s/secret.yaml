# k8s/secret.yaml
# Secret stores sensitive values.
# stringData lets us write readable local values; Kubernetes stores them as base64 internally.
apiVersion: v1
kind: Secret
metadata:
  name: swiftcart-secret
  namespace: swiftcart
type: Opaque
stringData:
  POSTGRES_USER: "swiftcart"
  POSTGRES_PASSWORD: "swiftcart_password"
  REDIS_PASSWORD: "swiftcart_redis_password"
  RABBITMQ_DEFAULT_USER: "swiftcart"
  RABBITMQ_DEFAULT_PASS: "swiftcart_password"
  JWT_SECRET: "local_super_secret_change_me"
