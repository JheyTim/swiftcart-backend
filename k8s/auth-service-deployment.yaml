apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: swiftcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: swiftcart/auth-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: swiftcart-config
            - secretRef:
                name: swiftcart-secret
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"